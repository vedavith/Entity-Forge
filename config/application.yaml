application:
  name: entity-forge-app

tenancy:
  enabled: true
  strategy: database          # shared | database
  resolver: header            # header | subdomain | jwt
  header_key: X-Tenant-ID
  # resolver: jwt
  # jwt_public_key: /path/to/public.pem
  # jwt_algorithm: RS256
  # jwt_tenant_claim: tenant_id

database:
  driver: mysql
  host: localhost
  port: 3306
  username: root
  password: root
  database: entity_forge