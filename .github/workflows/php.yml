name: CI

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }} — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        php: ["8.4"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_mysql, mbstring, xml
          coverage: pcov

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run tests with coverage
        run: vendor/bin/phpunit --no-progress --coverage-clover coverage/clover.xml --coverage-text

      - name: Enforce 80% line coverage
        run: |
          php -r "
          \$xml    = simplexml_load_file('coverage/clover.xml');
          \$m      = \$xml->project->metrics;
          \$total  = (int)\$m['statements'];
          \$covered = (int)\$m['coveredstatements'];
          \$pct    = \$total > 0 ? round(\$covered / \$total * 100, 2) : 0;
          echo \"Line coverage: {\$pct}%\n\";
          if (\$pct < 80) {
            echo \"FAIL: coverage {\$pct}% is below the required 80%.\n\";
            exit(1);
          }
          echo \"PASS\n\";
          "

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage/clover.xml
          fail_ci_if_error: false
